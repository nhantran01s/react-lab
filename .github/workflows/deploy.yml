name: Deloy React Lab
on:
  push:
    branches:
      - main
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          key: ${{secrets.SERVER_SSH_KEY}}
          script: |
            cd /home/deploy/react-lab
            git pull origin main
          docker build -t react-lab:latest .
          docker rm -f react-lab || true
        docker run -d --name react-lab --restart unless-stopped -p 8081:80 react-lab:latest
