name: Deploy React Lab
on:
  push:
    branches:
      - main
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Show commit SHA
        run: echo "Commit SHA = ${{ github.sha }}"
      - name: Checkout soucre
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install dependencies
        run: npm ci
      - name: Build React
        run: npm run build
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - name: Build Docker iamge
        run: |
          docker build \
              -t nhantran2001/react-lab:latest \
              -t nhantran2001/react-lab:${{ github.sha }} \
              .   
      - name: Push Docker image
        run: |
           docker push nhantran2001/react-lab:latest
           docker push nhantran2001/react-lab:${{ github.sha }}
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.SERVER_HOST}}
          username: ${{secrets.SERVER_USER}}
          key: ${{secrets.SERVER_SSH_KEY}}
          script: |
            docker pull nhantran2001/react-lab:latest
            docker rm -f react-lab || true
            docker run -d --name react-lab --restart unless-stopped -p 8081:80 nhantran2001/react-lab:latest
